# .claude/gate.conf — the gate's commands for THIS repo.
# The worker cannot edit this file (protect-paths.sh + deny rules).
#
# "Adapt the commands to the repo's stack" written in a soul is a wish.
# Written here, it is a fact.

# Every command may be empty EXCEPT coverage, which must be set or explicitly
# waived. A gate that skips a check it cannot run is not a gate.

LINT_CMD=".venv/bin/ruff check ."
TYPECHECK_CMD=""
# Single instrumented run: the
# coverage-instrumented run IS the test run. TEST_CMD running the suite plain
# and COVERAGE_CMD running it again doubles suite time (and any fixture
# boots) for identical assertions — a real measured win on a repo this pattern
# was ported from (7m43s vs 13-15m for the same suite run twice).
TEST_CMD=".venv/bin/python3 -m coverage run -m pytest tests"

# Functional cycle — REQUIRED for any repo that ships a runnable app (the
# gate detects compose files / Dockerfile / deploy/ and fails until this is
# set or deliberately waived). Unit tests prove the code; this proves the
# APPLICATION: boot an ephemeral instance, apply the repo's config the way
# prod applies it, interrogate it via API + browser. The verb contract lives
# in TESTING.md; scaffold from scripts/test-stack.sh.example. Reference
# implementation pattern: born from a prod 500 that a green gate once let through.
# FUNCTIONAL_CMD="bash scripts/test-stack.sh ci"        # full cycle
# FUNCTIONAL_CMD="bash scripts/test-stack.sh ci --no-e2e"  # if e2e is too slow per-card
# Optional: run the cycle only when the diff (vs BASE_REF, incl. untracked)
# touches one of these space-separated PATH PREFIXES. For repos whose
# TEST_CMD already boots an app fixture; unset = every card pays the cycle.
# FUNCTIONAL_PATHS="deploy/ tests/integration/ tests/e2e/"
# Waive ONLY for pure-library/docs repos, as a deliberate, reviewable decision:
# GATE_ALLOW_MISSING_FUNCTIONAL=1
FUNCTIONAL_CMD=""

# Must produce ./coverage.json for gate-coverage.py. The suite already ran
# instrumented in TEST_CMD; this just renders its data (<1s).
COVERAGE_CMD=".venv/bin/python3 -m coverage json -o coverage.json"

# Waive coverage ONLY as a deliberate, reviewable decision:
# GATE_ALLOW_MISSING_COVERAGE=1

COVERAGE_MIN=80     # on CHANGED lines, not the whole repo
DIFF_MAX=600        # changed lines; above this -> "decompose this card"
BASE_REF=feat/openai-growth-agents
