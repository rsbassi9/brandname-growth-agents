name: Backend Gate

# Independent verification of scripts/gate.sh -- the same script and the
# same .claude/gate.conf commands a kanban worker runs locally, run here
# where a worker cannot influence the result. None of this repo's other
# workflows (frontend-studio, pages, daily-growth) touch the Python
# backend, so this is a clean addition, not a modification of anything
# that already runs. Added by hermes-agent-build's provisioning; see
# CLAUDE.md / TESTING.md.

on:
  push:
    branches: [main, feat/openai-growth-agents]
  pull_request:

concurrency:
  group: backend-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate.sh (independent verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # gate.sh diffs against the base branch; needs real history
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Build the same .venv gate.conf expects
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.txt -r requirements-dev.txt
          uv pip install --python .venv coverage
      # gate.conf's BASE_REF=feat/openai-growth-agents needs a resolvable
      # local ref regardless of trigger context -- a PR checkout leaves
      # HEAD detached with no local branch of that name, only the
      # origin/ remote-tracking ref.
      - name: Ensure a local feat/openai-growth-agents ref exists
        run: git rev-parse --verify --quiet feat/openai-growth-agents >/dev/null || git branch feat/openai-growth-agents origin/feat/openai-growth-agents
      # Bare invocation, no --base override: gate.sh reads BASE_REF from
      # .claude/gate.conf on its own. pipeline-control.py's readiness
      # check requires this exact invocation with no extra args.
      - name: Run the gate
        run: bash scripts/gate.sh
