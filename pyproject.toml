[project]
name = "brandname-growth-agents"
version = "0.1.0"
description = "Brand growth agents: content strategy, generation, and studio dashboard."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "outputs", "memory", "dashboard", "pages", "site", "Brand Name"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
